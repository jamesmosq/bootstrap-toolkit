<!--
description: Bootstrap 5 figure: real photo with caption
var PHOTO: figure1
var CAPTION: A caption for the above image.
-->
<figure class="figure">
  <img src="https://picsum.photos/seed/$PHOTO$/400/300" class="figure-img img-fluid rounded" alt="$CAPTION$">
  <figcaption class="figure-caption">$CAPTION$</figcaption>
</figure>
