<!--
description: Bootstrap 5 blockquote with attribution
var QUOTE: A well-known quote, contained in a blockquote element.
var AUTHOR: Someone famous
var SOURCE: Source Title
-->
<figure>
  <blockquote class="blockquote">
    <p>$QUOTE$</p>
  </blockquote>
  <figcaption class="blockquote-footer">
    $AUTHOR$ in <cite title="$SOURCE$">$SOURCE$</cite>
  </figcaption>
</figure>
