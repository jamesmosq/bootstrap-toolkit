<!--
description: Bootstrap 5 progress bar
var VALUE: 25
var COLOR: primary
options COLOR: primary, secondary, success, danger, warning, info, light, dark
var LABEL: Progress
-->
<div class="progress" role="progressbar" aria-label="$LABEL$" aria-valuenow="$VALUE$" aria-valuemin="0" aria-valuemax="100">
  <div class="progress-bar text-bg-$COLOR$" style="width: $VALUE$%">$VALUE$%</div>
</div>
