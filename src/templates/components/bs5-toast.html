<!--
description: Bootstrap 5 toast in the lower right corner (show it with bootstrap.Toast)
var ID: liveToast
var TITLE: Bootstrap
var MESSAGE: Hello, world! This is a toast message.
-->
<!-- Show it with: bootstrap.Toast.getOrCreateInstance(document.getElementById('$ID$')).show() -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="$ID$" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <i class="bi bi-bell-fill me-2" aria-hidden="true"></i>
      <strong class="me-auto">$TITLE$</strong>
      <small>just now</small>
      <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body">
      $MESSAGE$
    </div>
  </div>
</div>
