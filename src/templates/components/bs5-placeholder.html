<!--
description: Bootstrap 5 loading placeholder (skeleton) of a card
var ANIMATION: glow
options ANIMATION: glow, wave
-->
<div class="card" aria-hidden="true">
  <div class="card-img-top placeholder" style="height: 180px;"></div>
  <div class="card-body">
    <h5 class="card-title placeholder-$ANIMATION$">
      <span class="placeholder col-6"></span>
    </h5>
    <p class="card-text placeholder-$ANIMATION$">
      <span class="placeholder col-7"></span>
      <span class="placeholder col-4"></span>
      <span class="placeholder col-4"></span>
      <span class="placeholder col-6"></span>
      <span class="placeholder col-8"></span>
    </p>
    <a class="btn btn-primary disabled placeholder col-6" aria-disabled="true"></a>
  </div>
</div>
