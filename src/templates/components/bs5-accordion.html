<!--
description: Bootstrap 5 accordion with three items, the first one open
var ID: accordionExample
-->
<div class="accordion" id="$ID$">
  <div class="accordion-item">
    <h2 class="accordion-header">
      <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#$ID$One" aria-expanded="true" aria-controls="$ID$One">
        Accordion Item #1
      </button>
    </h2>
    <div id="$ID$One" class="accordion-collapse collapse show" data-bs-parent="#$ID$">
      <div class="accordion-body">
        <strong>This is the first item's accordion body.</strong> It is shown by default.
      </div>
    </div>
  </div>
  <div class="accordion-item">
    <h2 class="accordion-header">
      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#$ID$Two" aria-expanded="false" aria-controls="$ID$Two">
        Accordion Item #2
      </button>
    </h2>
    <div id="$ID$Two" class="accordion-collapse collapse" data-bs-parent="#$ID$">
      <div class="accordion-body">
        <strong>This is the second item's accordion body.</strong> It is hidden by default.
      </div>
    </div>
  </div>
  <div class="accordion-item">
    <h2 class="accordion-header">
      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#$ID$Three" aria-expanded="false" aria-controls="$ID$Three">
        Accordion Item #3
      </button>
    </h2>
    <div id="$ID$Three" class="accordion-collapse collapse" data-bs-parent="#$ID$">
      <div class="accordion-body">
        <strong>This is the third item's accordion body.</strong> It is hidden by default.
      </div>
    </div>
  </div>
</div>
