<!--
description: Bootstrap 5 offcanvas side panel with its trigger button
var ID: offcanvasExample
var PLACEMENT: start
options PLACEMENT: start, end, top, bottom
var BUTTON: Open panel
var TITLE: Offcanvas
-->
<button class="btn btn-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#$ID$" aria-controls="$ID$">
  $BUTTON$
</button>
<div class="offcanvas offcanvas-$PLACEMENT$" tabindex="-1" id="$ID$" aria-labelledby="$ID$Label">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="$ID$Label">$TITLE$</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    Some text as placeholder. In real life you can have the elements you have chosen. Like, text, images, lists, etc.
  </div>
</div>
