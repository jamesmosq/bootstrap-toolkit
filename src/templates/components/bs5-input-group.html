<!--
description: Bootstrap 5 input group with a text addon
var ID: basic-addon1
var ADDON: @
var PLACEHOLDER: Username
-->
<div class="input-group mb-3">
  <span class="input-group-text" id="$ID$">$ADDON$</span>
  <input type="text" class="form-control" placeholder="$PLACEHOLDER$" aria-label="$PLACEHOLDER$" aria-describedby="$ID$">
</div>
