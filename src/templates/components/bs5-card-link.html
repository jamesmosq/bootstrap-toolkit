<!--
description: Bootstrap 5 card that is clickable as a whole (stretched link), with a real photo
var TITLE: Card with stretched link
var HREF: #
var PHOTO: card1
-->
<div class="card" style="width: 18rem;">
  <img src="https://picsum.photos/seed/$PHOTO$/600/400" class="card-img-top" alt="$TITLE$">
  <div class="card-body">
    <h5 class="card-title">$TITLE$</h5>
    <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's content.</p>
    <a href="$HREF$" class="btn btn-primary stretched-link">Go somewhere</a>
  </div>
</div>
