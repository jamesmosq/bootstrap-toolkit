<!--
description: Bootstrap 5 modal with its trigger button
var ID: exampleModal
var DIALOG: modal-dialog-centered
options DIALOG: modal-dialog-centered, modal-dialog-scrollable, modal-sm, modal-lg, modal-xl, modal-fullscreen
var BUTTON: Launch demo modal
var TITLE: Modal title
var BODY: Modal body text goes here.
-->
<!-- Button trigger modal -->
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#$ID$">
  $BUTTON$
</button>
<!-- Modal -->
<div class="modal fade" id="$ID$" tabindex="-1" aria-labelledby="$ID$Label" aria-hidden="true">
  <div class="modal-dialog $DIALOG$">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="$ID$Label">$TITLE$</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        $BODY$
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Save changes</button>
      </div>
    </div>
  </div>
</div>
