<!--
description: Bootstrap 5 collapse with its toggle button
var ID: collapseExample
var BUTTON: Toggle content
-->
<button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#$ID$" aria-expanded="false" aria-controls="$ID$">
  $BUTTON$
</button>
<div class="collapse" id="$ID$">
  <div class="card card-body">
    Some placeholder content for the collapse component. This panel is hidden by default but revealed when the user activates the relevant trigger.
  </div>
</div>
