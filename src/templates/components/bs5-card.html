<!--
description: Bootstrap 5 card with image, title, text and button
var TITLE: Card title
var TEXT: Some quick example text to build on the card title and make up the bulk of the card's content.
var BUTTON: Go somewhere
-->
<div class="card" style="width: 18rem;">
  <img src="https://picsum.photos/600/400" class="card-img-top" alt="$TITLE$">
  <div class="card-body">
    <h5 class="card-title">$TITLE$</h5>
    <p class="card-text">$TEXT$</p>
    <a href="#" class="btn btn-primary">$BUTTON$</a>
  </div>
</div>
