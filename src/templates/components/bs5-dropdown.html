<!--
description: Bootstrap 5 dropdown button with menu
var VARIANT: secondary
options VARIANT: primary, secondary, success, danger, warning, info, light, dark
var TEXT: Dropdown button
-->
<div class="dropdown">
  <button class="btn btn-$VARIANT$ dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
    $TEXT$
  </button>
  <ul class="dropdown-menu">
    <li><a class="dropdown-item" href="#">Action</a></li>
    <li><a class="dropdown-item" href="#">Another action</a></li>
    <li><a class="dropdown-item" href="#">Something else here</a></li>
  </ul>
</div>
